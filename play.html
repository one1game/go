<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Игра</title>
<link rel="icon" href="assets/icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;
  font:14px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}

#ctl{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 10px);
  left:0;right:0;padding:0 10px;display:flex;justify-content:space-between;
  pointer-events:none}
#ctl button{
  pointer-events:auto;width:40px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.14);
  background:rgba(10,12,18,.34);color:rgba(255,255,255,.5);font-size:19px;line-height:1;
  display:grid;place-items:center;transition:background .2s,color .2s,transform .12s;
}
#ctl button:active{transform:scale(.9)}
#ctl.awake button{background:rgba(10,12,18,.72);color:#fff}
#ctl svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#ask{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;
  background:rgba(0,0,0,.62);
  animation:fade .25s;transition:opacity .35s}
#ask[hidden]{display:none!important}
#ask.gone{opacity:0;pointer-events:none}
#ask button{
  width:100%;max-width:340px;height:60px;border-radius:20px;border:0;
  background:linear-gradient(135deg,#5b8cff,#22d3a6);color:#06121a;
  font-size:17px;font-weight:800;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);
}
#ask button:active{transform:scale(.97)}
#ask small{display:block;text-align:center;margin-top:12px;color:rgba(255,255,255,.6);font-size:12.5px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<iframe id="f" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope" allowfullscreen></iframe>

<div id="ask" hidden>
  <div>
    <button id="ask-fs">⤢ На весь экран</button>
    <small>или просто играй — выйти можно кнопкой ←</small>
  </div>
</div>

<div id="ctl">
  <button id="back" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="toggle" aria-label="Полный экран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></svg></button>
</div>

<script src="games.js"></script>
<script>
(function () {
  'use strict';

  const p = new URLSearchParams(location.search);
  const slug = p.get('g') || '';
  const raw = p.get('u') || '';
  const list = Array.isArray(window.GAMES) ? window.GAMES : [];
  const game = list.find(x => x.slug === slug);
  const target = raw || (game ? game.url : '');

  document.title = game ? game.title : 'Игра';

  /* Внешняя игра или игра не найдена — открываем напрямую */
  if (!target || /^https?:/i.test(target)) {
    location.replace(target || 'index.html');
    return;
  }

  document.getElementById('f').src = target;

  /* ── Полный экран ─────────────────────────────────── */
  const el = document.documentElement;
  const canFS = !!(el.requestFullscreen || el.webkitRequestFullscreen);
  const ask = document.getElementById('ask');

  function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

  let pending = false;
  let manual = false; // игрок сам вышел из полного экрана — не навязываемся

  function enterFS() {
    if (!canFS || isFS() || pending) return false;
    pending = true;
    setTimeout(() => { pending = false; }, 800);
    const std = !!el.requestFullscreen;
    const fn = std ? el.requestFullscreen : el.webkitRequestFullscreen;
    let res;
    try { res = std ? fn.call(el, { navigationUI: 'hide' }) : fn.call(el); } catch (e) { res = null; }
    manual = false;
    if (res && res.catch) res.catch(() => { if (!isFS()) showAsk(); });
    return true;
  }

  function exitFS() {
    const fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn && isFS()) { manual = true; fn.call(document); }
  }

  function showAsk() {
    if (!canFS) return;
    ask.hidden = false;
    ask.classList.remove('gone');
    clearTimeout(showAsk._t);
    showAsk._t = setTimeout(dismissAsk, 6000); // не мешаем играть, если полный экран не нужен
  }

  function dismissAsk() {
    clearTimeout(showAsk._t);
    ask.classList.add('gone');
    setTimeout(() => { ask.hidden = true; }, 400);
  }

  function sync() {
    if (isFS() || manual) dismissAsk();
    else showAsk();
    const c = document.getElementById('ctl');
    c.classList.add('awake');
    clearTimeout(sync._t);
    sync._t = setTimeout(() => c.classList.remove('awake'), 2200);
  }

  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);

  /* Пробуем развернуть сразу после навигации (жест «Играть» ещё активен) */
  window.addEventListener('load', () => { setTimeout(() => { if (!enterFS()) showAsk(); }, 60); });

  /* Первый тап по затемнению — гарантированный вход в полный экран */
  ask.addEventListener('pointerdown', () => enterFS(), { capture: true });

  /* Любой тап по нашей полосе — держим кнопки видимыми */
  document.addEventListener('pointerdown', () => {
    const c = document.getElementById('ctl');
    c.classList.add('awake');
    clearTimeout(sync._t);
    sync._t = setTimeout(() => c.classList.remove('awake'), 2200);
  }, { passive: true });

  document.getElementById('toggle').addEventListener('click', () => { isFS() ? exitFS() : enterFS(); });

  document.getElementById('back').addEventListener('click', () => {
    exitFS();
    const ref = document.referrer ? new URL(document.referrer) : null;
    if (ref && ref.origin === location.origin) history.back();
    else location.href = 'index.html';
  });

  /* Android-кнопка «назад» / Esc: выходим из полного экрана, затем из игры */
  window.addEventListener('popstate', () => exitFS());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isFS()) exitFS(); });

  if (!canFS) { ask.hidden = true; document.getElementById('toggle').hidden = true; }
})();
</script>
</body>
</html>
